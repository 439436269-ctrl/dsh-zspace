# dsh-zspace bundle patch: one row inserted over whatever layers came before it.
#
# A patch replaces the targeted row's whole `config`, so a profile that
# overrides this row must restate every key it wants to keep.
#
# Every value below has a code-side default, so this patch stays valid even on
# a host without patch-side helper evaluation. `homePath` / `publicPath` are
# intentionally empty: the plugin discovers them from the NAS storage pools at
# runtime (e.g. /sata1/my/data and /sata1/public), which keeps the same file
# working on NAS models that name their pools differently.

- insert:
    - id: zspace
      name: dsh-zspace
      config:
        baseUrl: http://127.0.0.1:13579
        apiVersion: "2.3.2026042401"
        homePath: ""
        publicPath: ""
        downloadDir: ""
        readMaxBytes: 262144
        listMaxEntries: 2000
        timeoutMs: 60000
        maxRetries: 2
        smallUploadMaxBytes: 8388608
        sliceSize: 2097152
        promptEnabled: true
        promptOrder: 60
